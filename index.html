<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notely — Notes that stay organized</title>
<meta name="theme-color" content="#6e95b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notely">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body class="view-list">
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span>Notely</div>
    <button id="new-note-btn" class="new-note-btn" type="button">+ New Note</button>
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search notes, tags…" autocomplete="off">
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" type="button" data-filter="all">All notes</button>
      <button class="nav-item" type="button" data-filter="pinned">Pinned</button>
    </nav>
    <div class="tags-panel">
      <div class="tags-title">Tags</div>
      <div id="tag-list"></div>
    </div>
    <div class="sidebar-foot">New notes get their own soft colour</div>
  </aside>

  <section class="notes-pane">
    <div class="mobile-top">
      <button id="menu-btn" class="icon-btn" type="button" title="Menu">☰</button>
      <span class="mobile-brand">Notely</span>
      <button id="search-toggle-btn" class="icon-btn" type="button" title="Search">🔍</button>
    </div>
    <div class="notes-header">
      <span id="notes-title">All notes</span>
      <label class="sort-label">Sort
        <select id="sort-select">
          <option value="updated">Last edited</option>
          <option value="created">Date created</option>
          <option value="title">Title A–Z</option>
        </select>
      </label>
    </div>
    <div id="notes-list" class="notes-list"></div>
  </section>

  <main class="editor-pane" id="editor-pane">
    <div class="empty-state" id="empty-state">
      <div class="empty-logo"><span class="brand-dot"></span></div>
      <h2>Welcome to Notely</h2>
      <p>Colourful notes, one-tap copy, smart tables, and focus mode — all saved on your device.</p>
      <button id="empty-new-btn" class="new-note-btn" type="button">+ Create your first note</button>
      <div class="empty-features">
        <span>🎨 Soft colours</span>
        <span>⊞ Smart tables</span>
        <span>✂️ Easy copy</span>
      </div>
    </div>

    <div class="editor hidden" id="editor">
      <div class="editor-top">
        <button id="back-btn" class="icon-btn back-btn" type="button" title="Back">←</button>
        <input id="note-title" class="note-title" type="text" placeholder="Untitled note" autocomplete="off">
        <div class="editor-actions">
          <button id="pin-btn" type="button" title="Pin">Pin</button>
          <button id="color-btn" type="button" title="Colour">🎨</button>
          <button id="focus-btn" type="button" title="Focus mode">⛶</button>
          <button id="delete-btn" type="button" title="Delete">🗑</button>
        </div>
      </div>
      <div class="toolbar" id="toolbar">
        <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
        <span class="sep"></span>
        <button type="button" data-cmd="formatBlock" data-value="H2" title="Heading">H</button>
        <button type="button" data-cmd="formatBlock" data-value="P" title="Paragraph">¶</button>
        <span class="sep"></span>
        <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
        <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
        <span class="sep"></span>
        <button type="button" data-cmd="formatBlock" data-value="PRE" title="Code block">&lt;/&gt;</button>
        <button id="insert-table-btn" type="button" title="Insert a table">⊞ Table</button>
        <span class="sep"></span>
        <button id="attach-btn" type="button" title="Attach files (images, PDFs)">📎</button>
        <button id="ocr-btn" type="button" title="Extract text from an attached image (offline OCR)">🔎 OCR</button>
        <select id="ocr-lang" class="toolbar-select" title="OCR language">
          <option value="eng">English</option>
          <option value="ben">বাংলা</option>
          <option value="eng+ben">English + বাংলা</option>
        </select>
        <span class="sep"></span>
        <select id="font-select" class="toolbar-select" title="Editor font">
          <option value="default">Default font</option>
          <option value="inter">Inter (English)</option>
          <option value="serif">Source Serif (English)</option>
          <option value="hind">Hind Siliguri (বাংলা)</option>
          <option value="notosansbn">Noto Sans Bengali (বাংলা)</option>
          <option value="notoserifbn">Noto Serif Bengali (বাংলা)</option>
        </select>
        <input id="file-input" type="file" hidden multiple accept="image/*,.pdf,application/pdf">
      </div>
      <div id="note-colorbar" class="note-colorbar"></div>
      <div class="content-scroll">
        <div id="note-content" class="note-content" contenteditable="true" spellcheck="false" data-placeholder="Start writing…"></div>
      </div>
      <div id="attachments" class="attachments hidden">
        <div class="attachments-title">Attachments</div>
        <div id="attachment-list" class="attachment-list"></div>
      </div>
      <div id="ocr-progress" class="ocr-progress hidden">
        <div class="ocr-bar">
          <div id="ocr-bar-fill" class="ocr-bar-fill"></div>
        </div>
        <span id="ocr-status" class="ocr-status"></span>
      </div>
      <div class="editor-bottom">
        <div class="bottom-left">
          <input id="tag-input" type="text" placeholder="Add a tag, press Enter…" autocomplete="off">
          <div id="tag-chips" class="tag-chips"></div>
        </div>
        <div class="bottom-right">
          <span id="word-count" class="word-count"></span>
          <button id="export-btn" type="button" title="Export as Markdown">⬇</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="sidebar-overlay" class="sidebar-overlay"></div>
<button id="fab" class="fab" type="button" title="New note">+</button>
<div id="sel-bar" class="sel-bar hidden"></div>
<script src="app.js?v=5"></script>
</body>
</html>
